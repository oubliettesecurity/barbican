name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: Mypy strict
        run: mypy --strict src/
      - name: Pytest
        run: pytest -q

  build:
    # Same allowlist gate the publish workflow runs before uploading.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Packaging boundary check
        env:
          BARBICAN_REQUIRE_DIST: "1"
        run: |
          pip install pytest
          python -m pytest -q --noconftest tests/test_packaging_boundary.py
