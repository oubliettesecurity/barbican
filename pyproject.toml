[build-system]
# hatchling 1.27 is the first release that emits core metadata 2.4 by default,
# the version that carries PEP 639's License-Expression and License-File fields.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oubliette-barbican"
version = "0.1.1"
description = "Defensive detection of coordinated synthetic influence-operation content (public twin of SPECTRE)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Oubliette Security LLC" }]
keywords = ["security", "influence-operations", "detection", "coordination", "synthetic-content"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Zero runtime dependencies: stdlib only after vendoring the scanner subset.
dependencies = []

[project.scripts]
barbican = "barbican.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/barbican"]

[tool.hatch.build.targets.wheel.force-include]
"src/barbican/py.typed" = "barbican/py.typed"
# The README tells a pip-install user to run the demo corpus, so it has to be in
# the WHEEL -- an examples/ directory reaches only the sdist. Guarded by
# tests/test_demo_corpus.py, which inspects the built artifact.
"src/barbican/data/demo_corpus.jsonl" = "barbican/data/demo_corpus.jsonl"

# sdist: the package sources only. Hatch adds pyproject.toml, README.md,
# PKG-INFO, the license-files (LICENSE, NOTICE) and the VCS .gitignore on its
# own. Without this, the sdist also sweeps in tests/, examples/ and .github/,
# as the published 0.1.0 sdist did.
# Enforced by tests/test_packaging_boundary.py.
[tool.hatch.build.targets.sdist]
only-include = ["src/barbican"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
