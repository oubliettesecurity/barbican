[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oubliette-barbican"
version = "0.1.0"
description = "Defensive detection of coordinated synthetic influence-operation content (public twin of SPECTRE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Oubliette Security LLC" }]
keywords = ["security", "influence-operations", "detection", "coordination", "synthetic-content"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Zero runtime dependencies: stdlib only after vendoring the scanner subset.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/barbican"]

[tool.hatch.build.targets.wheel.force-include]
"src/barbican/py.typed" = "barbican/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
